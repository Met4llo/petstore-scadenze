<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pet Store La Malfa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#c45a2a">
  <title>Pet Store La Malfa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo-petstore.png">
  <script>
    (function(){var t=localStorage.getItem('petstore_theme')||'light';document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('petstore_density')==='compact')document.documentElement.setAttribute('data-density','compact');})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2.51">
  <link rel="stylesheet" href="sheet-overlay.css?v=2.51">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="login-screen" class="screen login-screen">
    <div class="login-box">
      <img src="logo-petstore.png" alt="PetStore Conad" class="logo-login">
      <h1>Accesso operatori</h1>
      <p class="subtitle">Tocca il tuo nome</p>
      <div class="operator-grid" id="operator-grid">
        <button type="button" class="operator-card operator-btn" data-op="Santoemma"><span class="op-initial">S</span><span class="op-name">Santoemma</span></button>
        <button type="button" class="operator-card operator-btn" data-op="Fuschi"><span class="op-initial">F</span><span class="op-name">Fuschi</span></button>
        <button type="button" class="operator-card operator-btn" data-op="Pizzimenti"><span class="op-initial">P</span><span class="op-name">Pizzimenti</span></button>
        <button type="button" class="operator-card operator-btn" data-op="Sorrentino"><span class="op-initial">So</span><span class="op-name">Sorrentino</span></button>
      </div>
    </div>
  </div>

  <div id="password-screen" class="screen login-screen hidden">
    <div class="login-box login-box-pwd">
      <img src="logo-petstore.png" alt="PetStore Conad" class="logo-login">
      <h1 id="pwd-operator-name">Password</h1>
      <p class="subtitle">Inserisci la tua password personale</p>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      <p id="login-error" class="error hidden">Password non corretta</p>
      <button type="button" id="btn-back-to-operators" class="btn-text-back">Cambia operatore</button>
    </div>
    <div class="login-footer">
      <button id="login-btn" class="btn btn-primary btn-large">Entra</button>
    </div>
  </div>

  <!-- PLACEHOLDER: rest of file too large for single message - use git approach -->
</body>
</html>
