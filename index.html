<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pet Store La Malfa">
  <meta name="theme-color" content="#c45a2a">
  <title>Pet Store La Malfa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo-petstore.png">
  <script>
    (function(){var t=localStorage.getItem('petstore_theme')||'light';document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('petstore_density')==='compact')document.documentElement.setAttribute('data-density','compact');})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2.47b">
  <link rel="stylesheet" href="sheet-overlay.css?v=2.47b">
  <style>
  /* Emergency fix v2.47b – operator tiles */
  .operator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .operator-card, .operator-btn {
    width: 100%; padding: 18px 10px 16px; font-size: 1rem; border-radius: 20px !important;
    font-weight: 650; background: var(--card) !important; color: var(--text) !important;
    border: 1px solid var(--border) !important; min-height: 128px;
    display: flex !important; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .operator-card[data-op="Santoemma"] { border-top: 6px solid #c45a2a !important; }
  .operator-card[data-op="Fuschi"] { border-top: 6px solid #2563eb !important; }
  .operator-card[data-op="Pizzimenti"] { border-top: 6px solid #16a34a !important; }
  .operator-card[data-op="Sorrentino"] { border-top: 6px solid #7c3aed !important; }
  .op-initial {
    width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
    font-family: "Fraunces", Georgia, serif; font-size: 1.55rem; font-weight: 600; letter-spacing: -0.04em;
  }
  .operator-card[data-op="Santoemma"] .op-initial { background: #ffedd5; color: #9a3412; }
  .operator-card[data-op="Fuschi"] .op-initial { background: #dbeafe; color: #1d4ed8; }
  .operator-card[data-op="Pizzimenti"] .op-initial { background: #dcfce7; color: #166534; }
  .operator-card[data-op="Sorrentino"] .op-initial { background: #ede9fe; color: #6d28d9; }
  .op-name { font-weight: 800; font-size: 0.95rem; }
  </style>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="login-screen" class="screen login-screen">
    <div class="login-box">
      <img src="logo-petstore.png" alt="PetStore Conad" class="logo-login">
      <h1>Accesso operatori</h1>
      <p class="subtitle">Tocca il tuo nome</p>
      <div class="operator-grid" id="operator-grid">
        <button type="button" class="operator-card operator-btn" data-op="Santoemma"><span class="op-initial">S</span><span class="op-name">Santoemma</span></button>
        <button type="button" class="operator-card operator-btn" data-op="Fuschi"><span class="op-initial">F</span><span class="op-name">Fuschi</span></button>
        <button type="button" class="operator-card operator-btn" data-op="Pizzimenti"><span class="op-initial">P</span><span class="op-name">Pizzimenti</span></button>
        <button type="button" class="operator-card operator-btn" data-op="Sorrentino"><span class="op-initial">So</span><span class="op-name">Sorrentino</span></button>
      </div>
    </div>
  </div>
  <div id="password-screen" class="screen login-screen hidden">
    <div class="login-box login-box-pwd">
      <h1 id="pwd-title">Password</h1>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      <p class="error hidden" id="pwd-error">Password errata</p>
      <button type="button" id="btn-login" class="btn btn-primary btn-large">Entra</button>
      <button type="button" id="btn-back-login" class="btn-text-back">← Cambia operatore</button>
    </div>
  </div>
  <!-- Full pages restored from local v2.47 – the JS will handle the rest of the UI -->
  <div id="app" class="hidden">
    <!-- The complete structure is in the full local index; this emergency version ensures login works and tiles look correct. Reload after full restore. -->
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js?v=2.47b"></script>
  <script src="fuschi-home.js?v=2.47b"></script>
</body>
</html>
